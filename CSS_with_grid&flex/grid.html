<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grid</title>
    <style>
        .box{
            margin: 10px;
            padding: 20px;
            background-color: rgb(182, 211, 220);
            text-align: center;
        }

        .container{
            display: grid;
            /* grid-template-columns: 160px 160px 160px 160px; */
            /* grid-template-columns: repeat(3, 160px) ; */
            grid-template-columns: repeat(4, 1fr);
            gap: 5px;
        }
    </style>
</head>
<body>
    <body>
        <div class="container">
            <div class="box">Cat 1</div>
            <div class="box">Cat 2</div>
            <div class="box">Cat 3</div>
            <div class="box">Cat 4</div>
            <div class="box">Cat 5</div>
            <div class="box">Cat 6</div>
            <div class="box">Cat 7</div>
            <div class="box">Cat 8</div>
            <div class="box">Cat 9</div>
            <div class="box">Cat 10</div>
            <div class="box">Cat 11</div>
            <div class="box">Cat 12</div>
            <div class="box">Cat 13</div>
            <div class="box">Cat 14</div>
            <div class="box">Cat 15</div>
            <div class="box">Cat 16</div>
            <div class="box">Cat 17</div>
            <div class="box">Cat 18</div>
            <div class="box">Cat 19</div>
            <div class="box">Cat 20</div>
        </div>
    </body>
</body>
</html>
